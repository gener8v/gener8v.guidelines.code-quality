name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the TypeScript compiler outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          mkdir cq-typescript && cd cq-typescript
          npm init --yes > /dev/null
          npm install --no-audit --no-fund typescript
          test -f node_modules/typescript/package.json
          echo "CQ_TYPESCRIPT=$PWD/node_modules/typescript" >> "$GITHUB_ENV"
      - name: Guidelines, defaults and generated files agree
        run: python3 scripts/build_index.py --check
      - name: Generator tests
        run: python3 -m unittest discover -s scripts -p "*_test.py"
      - name: cq-measure tests with the TypeScript compiler
        run: PYTHONPATH=src python3 -m unittest discover -s src -p "*_test.py" -t src
      - name: cq-measure tests with the approximation
        run: CQ_TYPESCRIPT=off PYTHONPATH=src python3 -m unittest discover -s src -p "*_test.py" -t src
      - name: TypeScript measurer tests
        run: node --test src/cq_measure/metrics/measure-typescript.test.cjs
      - name: cq-measure on this repository
        run: PYTHONPATH=src python3 -m cq_measure .
