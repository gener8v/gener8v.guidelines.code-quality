[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cq-measure"
version = "0.1.0"
description = "Measure a repository against the gener8v code-quality guidelines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/gener8v/gener8v.guidelines.code-quality"

[project.scripts]
cq-measure = "cq_measure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cq_measure = ["defaults.json"]
